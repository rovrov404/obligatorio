{% extends "base.html" %}{% block title %}Jugadores{% endblock %}
{% block content %}
<div class="page-header"><h1>Jugadores</h1><a class="primary-button small-button" href="{{ url_for('players.create') }}">Nuevo jugador</a></div>
<div class="table-wrap"><table><thead><tr><th>CI</th><th>Nombre</th><th>Email</th><th>Facultad</th><th>Tipo</th><th>Acciones</th></tr></thead><tbody>
{% for p in players %}<tr><td>{{ p.ci }}</td><td>{{ p.apellido }}, {{ p.nombre }}</td><td>{{ p.email }}</td><td>{{ p.facultad }}</td><td>{{ p.tipo }}</td><td class="actions"><a class="small-button" href="{{ url_for('players.edit',ci=p.ci) }}">Editar</a><form method="post" action="{{ url_for('players.delete',ci=p.ci) }}" onsubmit="return confirm('¿Eliminar jugador?')"><button class="danger-button">Eliminar</button></form></td></tr>{% endfor %}
</tbody></table></div>{% endblock %}
