{% extends "base.html" %}{% block title %}Sanciones{% endblock %}{% block content %}<div class="page-header"><h1>Sanciones</h1><a class="small-button" href="{{ url_for('sanctions.create') }}">Nueva sanción</a></div><div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Torneo</th><th>Motivo</th><th>Desde</th><th>Fechas</th><th></th></tr></thead><tbody>{% for s in sanctions %}<tr><td>{{ s.jugador }}</td><td>{{ s.torneo }}</td><td>{{ s.motivo }}</td><td>{{ s.numero_fecha_inicio }}</td><td>{{ s.cantidad_fechas }}</td><td class="actions"><a class="small-button" href="{{ url_for('sanctions.edit',sanction_id=s.id_sancion) }}">Editar</a><form method="post" action="{{ url_for('sanctions.delete',sanction_id=s.id_sancion) }}"><button class="danger-button">Eliminar</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
