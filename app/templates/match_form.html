{% extends "base.html" %}{% block title %}Partido{% endblock %}{% block content %}<section class="card"><h1>{{ 'Editar' if match else 'Nuevo' }} partido</h1><form method="post" class="form-grid">
{% if not match %}<div class="form-field"><label>Torneo</label><select name="id_torneo">{% for t in tournaments %}<option value="{{ t.id_torneo }}">{{ t.nombre }} - {{ t.estado }}</option>{% endfor %}</select></div>{% endif %}
<div class="form-field"><label>Número de fecha</label><input type="number" min="1" name="numero_fecha" value="{{ match.numero_fecha if match else '' }}" required></div>
<div class="form-field"><label>Local</label><select name="id_equipo_local">{% for e in teams %}<option value="{{ e.id_equipo }}" {{ 'selected' if match and match.id_equipo_local==e.id_equipo else '' }}>{{ e.nombre }} (torneo {{ e.id_torneo }})</option>{% endfor %}</select></div>
<div class="form-field"><label>Visitante</label><select name="id_equipo_visitante">{% for e in teams %}<option value="{{ e.id_equipo }}" {{ 'selected' if match and match.id_equipo_visitante==e.id_equipo else '' }}>{{ e.nombre }} (torneo {{ e.id_torneo }})</option>{% endfor %}</select></div>
<div class="form-field"><label>Día</label><input type="date" name="dia" value="{{ match.dia if match else '' }}" required></div>
<div class="form-field"><label>Turno</label><select name="id_turno">{% for t in turns %}<option value="{{ t.id_turno }}" {{ 'selected' if match and match.id_turno==t.id_turno else '' }}>{{ t.hora_inicio }} - {{ t.hora_fin }}</option>{% endfor %}</select></div>
<div class="form-field"><label>Cancha</label><select name="court">{% for c in courts %}<option value="{{ c.id_complejo }}|{{ c.nombre_cancha }}" {{ 'selected' if match and match.id_complejo==c.id_complejo and match.nombre_cancha==c.nombre_cancha else '' }}>{{ c.complejo }} / {{ c.nombre_cancha }}</option>{% endfor %}</select></div>
<div class="form-field"><label>Estado</label><select name="estado">{% for s in states %}<option {{ 'selected' if match and match.estado==s else '' }}>{{ s }}</option>{% endfor %}</select></div><div class="form-field full actions"><button class="primary-button">Guardar</button><a class="secondary-button" href="{{ url_for('matches.index') }}">Cancelar</a></div></form></section>{% endblock %}
