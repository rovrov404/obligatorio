{% extends "base.html" %}{% block title %}Cancha{% endblock %}{% block content %}<section class="card"><h1>{{ 'Editar' if court else 'Nueva' }} cancha</h1><form method="post" class="form-grid">
{% if not court %}<div class="form-field"><label>Nombre</label><input name="nombre_cancha" required></div><div class="form-field"><label>Complejo</label><select name="id_complejo">{% for c in complexes %}<option value="{{ c.id_complejo }}">{{ c.nombre }}</option>{% endfor %}</select></div>{% else %}<p><strong>{{ court.nombre_cancha }}</strong></p>{% endif %}
<div class="form-field"><label>Superficie</label><select name="superficie"><option value="sintetico" {{ 'selected' if court and court.superficie=='sintetico' else '' }}>Sintético</option><option value="parquet" {{ 'selected' if court and court.superficie=='parquet' else '' }}>Parquet</option></select></div><label class="checkbox-field"><input type="checkbox" name="techada" {{ 'checked' if court and court.techada else '' }}> Techada</label><div class="form-field full actions"><button class="primary-button">Guardar</button><a class="secondary-button" href="{{ url_for('venues.index') }}">Cancelar</a></div></form></section>{% endblock %}
