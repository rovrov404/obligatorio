{% extends "base.html" %}{% block title %}Sanción{% endblock %}{% block content %}<section class="card"><h1>{{ 'Editar' if sanction else 'Nueva' }} sanción</h1><form method="post" class="form-grid"><div class="form-field"><label>Jugador</label><select name="ci_jugador">{% for p in players %}<option value="{{ p.ci }}" {{ 'selected' if sanction and sanction.ci_jugador==p.ci else '' }}>{{ p.apellido }}, {{ p.nombre }}</option>{% endfor %}</select></div><div class="form-field"><label>Torneo</label><select name="id_torneo">{% for t in tournaments %}<option value="{{ t.id_torneo }}" {{ 'selected' if sanction and sanction.id_torneo==t.id_torneo else '' }}>{{ t.nombre }}</option>{% endfor %}</select></div><div class="form-field"><label>Motivo</label><select name="motivo">{% for r in reasons %}<option {{ 'selected' if sanction and sanction.motivo==r else '' }}>{{ r }}</option>{% endfor %}</select></div><div class="form-field"><label>Fecha de inicio</label><input type="number" min="1" name="numero_fecha_inicio" value="{{ sanction.numero_fecha_inicio if sanction else '' }}" required></div><div class="form-field"><label>Cantidad de fechas</label><input type="number" min="1" name="cantidad_fechas" value="{{ sanction.cantidad_fechas if sanction else 1 }}" required></div><div class="form-field full actions"><button class="primary-button">Guardar</button><a class="secondary-button" href="{{ url_for('sanctions.index') }}">Cancelar</a></div></form></section>{% endblock %}
