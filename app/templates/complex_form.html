{% extends "base.html" %}{% block title %}Complejo{% endblock %}{% block content %}<section class="card"><h1>{{ 'Editar' if complex_item else 'Nuevo' }} complejo</h1><form method="post" class="form-grid"><div class="form-field"><label>Nombre</label><input name="nombre" value="{{ complex_item.nombre if complex_item else '' }}" required></div><div class="form-field"><label>Dirección</label><input name="direccion" value="{{ complex_item.direccion if complex_item else '' }}" required></div><div class="form-field"><label>Departamento</label><input name="departamento" value="{{ complex_item.departamento if complex_item else '' }}" required></div><div class="form-field full actions"><button class="primary-button">Guardar</button><a class="secondary-button" href="{{ url_for('venues.index') }}">Cancelar</a></div></form></section>{% endblock %}
