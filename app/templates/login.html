{% extends "base.html" %}

{% block title %}Iniciar sesión - Torneo F5{% endblock %}

{% block content %}
<section class="card login-card">
    <p class="eyebrow">Acceso al sistema</p>
    <h1>Iniciar sesión</h1>
    <p>Ingresa con un usuario administrador o planillero.</p>

    <form method="post" class="form-stack">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}" required maxlength="100">

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required maxlength="255">

        <button class="primary-button" type="submit">Entrar</button>
    </form>
</section>
{% endblock %}
